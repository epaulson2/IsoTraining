name: Import Eccentric Overload Batch 02

on:
  push:
    branches: [main]
    paths:
      - '.asset-import/eccentric-batch-02/**'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether package upload is complete
        id: chunks
        shell: bash
        run: |
          set -euo pipefail
          dir=.asset-import/eccentric-batch-02
          if [[ -s "$dir/COMPLETE" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruct and extract asset package
        if: steps.chunks.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          dir=.asset-import/eccentric-batch-02
          test -n "$(find "$dir" -maxdepth 1 -name 'part_*.txt' -print -quit)"
          cat "$dir"/part_*.txt | base64 --decode > /tmp/eccentric-batch-02.zip
          unzip -q -o /tmp/eccentric-batch-02.zip -d .

      - name: Verify canonical Batch 02 images
        if: steps.chunks.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            assets/eccentric-overload/core-6/03-supported-sissy-squat/LM03_supported_sissy_squat.webp
            assets/eccentric-overload/core-6/03-supported-sissy-squat/LL03_supported_sissy_squat_ladder.webp
            assets/eccentric-overload/core-6/03-supported-sissy-squat/WP03_supported_sissy_squat.webp
            assets/eccentric-overload/core-6/04-assisted-nordic/LM04_assisted_nordic.webp
            assets/eccentric-overload/core-6/04-assisted-nordic/LL04_assisted_nordic_ladder.webp
            assets/eccentric-overload/core-6/04-assisted-nordic/WP04_assisted_nordic.webp
            assets/eccentric-overload/core-6/05-ring-fallout/LM05_ring_fallout.webp
            assets/eccentric-overload/core-6/05-ring-fallout/LL05_ring_fallout_ladder.webp
            assets/eccentric-overload/core-6/05-ring-fallout/WP05_ring_fallout.webp
            assets/eccentric-overload/core-6/06-assisted-pullup/LM06_assisted_pullup.webp
          )
          for f in "${expected[@]}"; do
            test -s "$f" || { echo "Missing or empty: $f"; exit 1; }
          done

      - name: Commit imported assets and remove staging chunks
        if: steps.chunks.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .asset-import/eccentric-batch-02
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/eccentric-overload .asset-import/eccentric-batch-02
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Import eccentric overload visual batch 02'
          git push
