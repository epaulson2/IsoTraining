name: Import Eccentric Overload Batch 02

on:
  push:
    branches: [main]
    paths:
      - '.asset-import/eccentric-batch-02/**'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether upload is complete
        id: ready
        shell: bash
        run: |
          set -euo pipefail
          dir=.asset-import/eccentric-batch-02
          [[ -s "$dir/COMPLETE" ]] && echo "ready=true" >> "$GITHUB_OUTPUT" || echo "ready=false" >> "$GITHUB_OUTPUT"

      - name: Decode Batch 02 images robustly
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, re
          from pathlib import Path
          d=Path('.asset-import/eccentric-batch-02')
          mapping={
            'LM03':'assets/eccentric-overload/core-6/03-supported-sissy-squat/LM03_supported_sissy_squat.webp',
            'LL03':'assets/eccentric-overload/core-6/03-supported-sissy-squat/LL03_supported_sissy_squat_ladder.webp',
            'WP03':'assets/eccentric-overload/core-6/03-supported-sissy-squat/WP03_supported_sissy_squat.webp',
            'LM04':'assets/eccentric-overload/core-6/04-assisted-nordic/LM04_assisted_nordic.webp',
            'LL04':'assets/eccentric-overload/core-6/04-assisted-nordic/LL04_assisted_nordic_ladder.webp',
            'WP04':'assets/eccentric-overload/core-6/04-assisted-nordic/WP04_assisted_nordic.webp',
            'LM05':'assets/eccentric-overload/core-6/05-ring-fallout/LM05_ring_fallout.webp',
            'LL05':'assets/eccentric-overload/core-6/05-ring-fallout/LL05_ring_fallout_ladder.webp',
            'WP05':'assets/eccentric-overload/core-6/05-ring-fallout/WP05_ring_fallout.webp',
            'LM06':'assets/eccentric-overload/core-6/06-assisted-pullup/LM06_assisted_pullup.webp',
          }
          def payload(stem):
              parts=sorted(d.glob(stem+'_part_*.b64'))
              if parts:
                  print(stem, 'using', len(parts), 'chunks')
                  raw=''.join(p.read_text() for p in parts)
              else:
                  p=d/(stem+'.b64')
                  if not p.exists(): raise SystemExit(f'Missing staged payload for {stem}')
                  raw=p.read_text()
              s=re.sub(r'[^A-Za-z0-9+/=]', '', raw)
              if len(s)%4==1:
                  raise SystemExit(f'Malformed payload {stem}: base64 length {len(s)}')
              s += '='*((4-len(s)%4)%4)
              return base64.b64decode(s, validate=False)
          for stem,dst in mapping.items():
              data=payload(stem)
              out=Path(dst); out.parent.mkdir(parents=True, exist_ok=True); out.write_bytes(data)
          PY

      - name: Verify canonical Batch 02 images
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          expected=[
            'assets/eccentric-overload/core-6/03-supported-sissy-squat/LM03_supported_sissy_squat.webp',
            'assets/eccentric-overload/core-6/03-supported-sissy-squat/LL03_supported_sissy_squat_ladder.webp',
            'assets/eccentric-overload/core-6/03-supported-sissy-squat/WP03_supported_sissy_squat.webp',
            'assets/eccentric-overload/core-6/04-assisted-nordic/LM04_assisted_nordic.webp',
            'assets/eccentric-overload/core-6/04-assisted-nordic/LL04_assisted_nordic_ladder.webp',
            'assets/eccentric-overload/core-6/04-assisted-nordic/WP04_assisted_nordic.webp',
            'assets/eccentric-overload/core-6/05-ring-fallout/LM05_ring_fallout.webp',
            'assets/eccentric-overload/core-6/05-ring-fallout/LL05_ring_fallout_ladder.webp',
            'assets/eccentric-overload/core-6/05-ring-fallout/WP05_ring_fallout.webp',
            'assets/eccentric-overload/core-6/06-assisted-pullup/LM06_assisted_pullup.webp',
          ]
          for name in expected:
              data=Path(name).read_bytes()
              assert data[:4]==b'RIFF' and data[8:12]==b'WEBP', f'Not WebP: {name}'
              declared=int.from_bytes(data[4:8], 'little')+8
              assert declared==len(data), f'Truncated WebP {name}: declared {declared}, got {len(data)}'
              print(name, len(data), 'OK')
          PY

      - name: Commit imported assets and remove staging
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .asset-import/eccentric-batch-02
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/eccentric-overload .asset-import
          git diff --cached --quiet && exit 0
          git commit -m 'Import eccentric overload visual batch 02'
          git push
