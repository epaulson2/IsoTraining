name: Import Eccentric Overload Batch 02

on:
  push:
    branches: [main]
    paths:
      - '.asset-import/eccentric-batch-02/**'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether upload is complete
        id: ready
        shell: bash
        run: |
          set -euo pipefail
          dir=.asset-import/eccentric-batch-02
          [[ -s "$dir/COMPLETE" ]] && echo "ready=true" >> "$GITHUB_OUTPUT" || echo "ready=false" >> "$GITHUB_OUTPUT"

      - name: Decode Batch 02 images
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          d=.asset-import/eccentric-batch-02
          decode() { mkdir -p "$(dirname "$2")"; base64 --decode "$1" > "$2"; }
          decode "$d/LM03.b64" assets/eccentric-overload/core-6/03-supported-sissy-squat/LM03_supported_sissy_squat.webp
          decode "$d/LL03.b64" assets/eccentric-overload/core-6/03-supported-sissy-squat/LL03_supported_sissy_squat_ladder.webp
          decode "$d/WP03.b64" assets/eccentric-overload/core-6/03-supported-sissy-squat/WP03_supported_sissy_squat.webp
          decode "$d/LM04.b64" assets/eccentric-overload/core-6/04-assisted-nordic/LM04_assisted_nordic.webp
          decode "$d/LL04.b64" assets/eccentric-overload/core-6/04-assisted-nordic/LL04_assisted_nordic_ladder.webp
          decode "$d/WP04.b64" assets/eccentric-overload/core-6/04-assisted-nordic/WP04_assisted_nordic.webp
          decode "$d/LM05.b64" assets/eccentric-overload/core-6/05-ring-fallout/LM05_ring_fallout.webp
          decode "$d/LL05.b64" assets/eccentric-overload/core-6/05-ring-fallout/LL05_ring_fallout_ladder.webp
          decode "$d/WP05.b64" assets/eccentric-overload/core-6/05-ring-fallout/WP05_ring_fallout.webp
          decode "$d/LM06.b64" assets/eccentric-overload/core-6/06-assisted-pullup/LM06_assisted_pullup.webp

      - name: Verify canonical Batch 02 images
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            assets/eccentric-overload/core-6/03-supported-sissy-squat/LM03_supported_sissy_squat.webp
            assets/eccentric-overload/core-6/03-supported-sissy-squat/LL03_supported_sissy_squat_ladder.webp
            assets/eccentric-overload/core-6/03-supported-sissy-squat/WP03_supported_sissy_squat.webp
            assets/eccentric-overload/core-6/04-assisted-nordic/LM04_assisted_nordic.webp
            assets/eccentric-overload/core-6/04-assisted-nordic/LL04_assisted_nordic_ladder.webp
            assets/eccentric-overload/core-6/04-assisted-nordic/WP04_assisted_nordic.webp
            assets/eccentric-overload/core-6/05-ring-fallout/LM05_ring_fallout.webp
            assets/eccentric-overload/core-6/05-ring-fallout/LL05_ring_fallout_ladder.webp
            assets/eccentric-overload/core-6/05-ring-fallout/WP05_ring_fallout.webp
            assets/eccentric-overload/core-6/06-assisted-pullup/LM06_assisted_pullup.webp
          )
          for f in "${expected[@]}"; do test -s "$f" || { echo "Missing: $f"; exit 1; }; done

      - name: Commit imported assets and remove staging
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .asset-import/eccentric-batch-02
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/eccentric-overload .asset-import
          git diff --cached --quiet && exit 0
          git commit -m 'Import eccentric overload visual batch 02'
          git push
