name: Import Eccentric Overload Assets

on:
  push:
    branches: [main]
    paths:
      - '.asset-import/eccentric-batch-01-v2/**'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether package upload is complete
        id: chunks
        shell: bash
        run: |
          set -euo pipefail
          dir=.asset-import/eccentric-batch-01-v2
          if [[ -s "$dir/COMPLETE" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruct and extract asset package
        if: steps.chunks.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          dir=.asset-import/eccentric-batch-01-v2
          test -n "$(find "$dir" -maxdepth 1 -name 'part_*.txt' -print -quit)"
          cat "$dir"/part_*.txt | base64 --decode > /tmp/eccentric-batch-01.zip
          unzip -q -o /tmp/eccentric-batch-01.zip -d .

      - name: Verify canonical Batch 01 images
        if: steps.chunks.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            assets/eccentric-overload/universal/EO01_method_overview.webp
            assets/eccentric-overload/universal/EO02_calibration_zones.webp
            assets/eccentric-overload/universal/EO03_safety_escape_rules.webp
            assets/eccentric-overload/universal/EO04_leverage_ladder.webp
            assets/eccentric-overload/core-6/01-ring-chest-press/LM01_ring_chest_press.webp
            assets/eccentric-overload/core-6/01-ring-chest-press/LL01_ring_chest_press_ladder.webp
            assets/eccentric-overload/core-6/01-ring-chest-press/WP01_ring_chest_press.webp
            assets/eccentric-overload/core-6/02-ring-row/LM02_ring_row.webp
            assets/eccentric-overload/core-6/02-ring-row/LL02_ring_row_ladder.webp
            assets/eccentric-overload/core-6/02-ring-row/WP02_ring_row.webp
          )
          for f in "${expected[@]}"; do
            test -s "$f" || { echo "Missing or empty: $f"; exit 1; }
          done

      - name: Commit imported assets and remove staging chunks
        if: steps.chunks.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .asset-import/eccentric-batch-01-v2 .asset-import/eccentric-batch-01
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/eccentric-overload .asset-import
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Import eccentric overload visual batch 01'
          git push
